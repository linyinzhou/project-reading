<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Reading</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111414;
        --panel: #1a1e1e;
        --ink: #f0f2ed;
        --muted: #a8b0aa;
        --line: #343b39;
        --accent: #79cec4;
        --accent-2: #f2a080;
        --soft: #202d2b;
        --summary: #d7dcd7;
        --source-bg: #392a25;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .wrap {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
      }

      .top {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: end;
        padding: 28px 0 22px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      .subtitle,
      .meta,
      .empty,
      .error-list {
        color: var(--muted);
      }

      .stats {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .stat {
        min-width: 108px;
        border: 1px solid var(--line);
        background: var(--soft);
        padding: 10px 12px;
        border-radius: 8px;
      }

      .stat strong {
        display: block;
        font-size: 22px;
      }

      main {
        padding: 24px 0 40px;
      }

      .period + .period {
        margin-top: 32px;
      }

      .period-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
      }

      .period-heading h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.3;
      }

      .period-count {
        color: var(--muted);
        font-size: 14px;
      }

      .book-list {
        display: grid;
        gap: 12px;
      }

      .book {
        display: grid;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel);
      }

      .book h2 {
        margin: 0;
        font-size: 19px;
        line-height: 1.35;
      }

      .book a {
        color: var(--accent);
        text-decoration: none;
      }

      .book a:hover {
        text-decoration: underline;
      }

      .summary {
        margin: 0;
        color: var(--summary);
        line-height: 1.7;
      }

      .source {
        display: inline-flex;
        width: fit-content;
        border-radius: 999px;
        padding: 3px 9px;
        background: var(--source-bg);
        color: var(--accent-2);
        font-size: 13px;
      }

      .error-list {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
        font-size: 14px;
      }

      @media (max-width: 720px) {
        .top {
          grid-template-columns: 1fr;
        }

        .stats {
          justify-content: flex-start;
        }

      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap top">
        <div>
          <h1>Project Reading</h1>
          <div class="meta" id="updated">读取中...</div>
        </div>
        <div class="stats">
          <div class="stat"><strong id="today-count">0</strong><span>今天发现</span></div>
          <div class="stat"><strong id="week-count">0</strong><span>近 7 天</span></div>
          <div class="stat"><strong id="fetched-count">0</strong><span>抓取条目</span></div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="period">
        <div class="period-heading">
          <h2>今天</h2>
          <span class="period-count" id="today-label">0 本</span>
        </div>
        <div class="book-list" id="today-list"></div>
      </section>
      <section class="period">
        <div class="period-heading">
          <h2>过去 6 天</h2>
          <span class="period-count" id="week-label">0 本</span>
        </div>
        <div class="book-list" id="week-list"></div>
      </section>
      <section class="error-list" id="errors"></section>
    </main>

    <script>
      function formatDate(value) {
        if (!value) return "尚未生成数据";
        return new Intl.DateTimeFormat("zh-CN", {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Asia/Shanghai",
        }).format(new Date(value));
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character],
        );
      }

      function renderBookList(selector, books, emptyMessage) {
        const list = document.querySelector(selector);
        if (!books.length) {
          list.innerHTML = `<div class="empty">${escapeHtml(emptyMessage)}</div>`;
          return;
        }

        list.innerHTML = books
          .map((book) => {
            const bookTitle = escapeHtml(book.title || "Untitled");
            const title = book.link
              ? `<a href="${escapeHtml(book.link)}" target="_blank" rel="noreferrer">${bookTitle}</a>`
              : bookTitle;
            const details = [book.author && `作者：${escapeHtml(book.author)}`, book.published && `出版：${escapeHtml(book.published)}`]
              .filter(Boolean)
              .join("；");
            return `<article class="book">
              <h2>${title}</h2>
              ${details ? `<div class="meta">${details}</div>` : ""}
              ${book.summary ? `<p class="summary">${escapeHtml(book.summary)}</p>` : ""}
              <span class="source">${escapeHtml(book.source || "Unknown source")}</span>
            </article>`;
          })
          .join("");
      }

      function shanghaiDay(value) {
        const parts = new Intl.DateTimeFormat("en", {
          year: "numeric",
          month: "numeric",
          day: "numeric",
          timeZone: "Asia/Shanghai",
        }).formatToParts(new Date(value));
        const values = Object.fromEntries(parts.map((part) => [part.type, Number(part.value)]));
        return Date.UTC(values.year, values.month - 1, values.day);
      }

      function groupBooks(books, generatedAt) {
        const referenceDay = shanghaiDay(generatedAt || new Date());
        const today = [];
        const week = [];

        for (const book of books) {
          const discoveredDay = shanghaiDay(book.discovered_at || generatedAt);
          const ageInDays = Math.round((referenceDay - discoveredDay) / 86400000);
          if (ageInDays === 0) today.push(book);
          else if (ageInDays > 0 && ageInDays <= 6) week.push(book);
        }
        return { today, week };
      }

      function renderErrors(errors) {
        const box = document.querySelector("#errors");
        if (!errors || !errors.length) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = `<strong>数据源提醒</strong><ul>${errors.map((error) => `<li>${error}</li>`).join("")}</ul>`;
      }

      async function init() {
        try {
          const response = await fetch("books.json", { cache: "no-store" });
          const data = await response.json();
          const grouped = groupBooks(data.books || [], data.generated_at);
          const sourceUnavailable = !data.fetched_count && data.source_errors?.length;
          const todayEmpty = sourceUnavailable
            ? "数据源暂时不可用，无法判断今天是否有新书。"
            : "今天暂未发现符合关注方向的新书。";
          document.querySelector("#updated").textContent = `刷新时间：${formatDate(data.generated_at)}`;
          document.querySelector("#today-count").textContent = grouped.today.length;
          document.querySelector("#week-count").textContent = grouped.today.length + grouped.week.length;
          document.querySelector("#fetched-count").textContent = data.fetched_count || 0;
          document.querySelector("#today-label").textContent = `${grouped.today.length} 本`;
          document.querySelector("#week-label").textContent = `${grouped.week.length} 本`;
          renderBookList("#today-list", grouped.today, todayEmpty);
          renderBookList("#week-list", grouped.week, "此前 6 天暂未发现符合关注方向的新书。");
          renderErrors(data.source_errors);
        } catch (error) {
          document.querySelector("#updated").textContent = "数据读取失败";
          document.querySelector("#today-list").innerHTML = '<div class="empty">暂时无法读取 books.json。</div>';
        }
      }

      init();
    </script>
  </body>
</html>
